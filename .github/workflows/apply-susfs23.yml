name: Apply SuSFS 2.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android16-aptusitu
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Revert SuSFS v2.2.0
        run: |
          set -x
          git revert --no-edit 6aef5ee8cb4cecac80c168f5ac53db5f8874bd97
          git revert --no-edit 306f7988de023f607004441858d9ddfe1e4686df
          git revert --no-edit 78820ec5547eb285f83051f2e08e41e330fab6b6

      - name: Cherry-pick SuSFS v2.3.0 integration
        run: |
          set -x
          git cherry-pick 0b8a115ddd4125dbda533a607f8de8ef2a08d56e

      - name: Push
        run: |
          git log --oneline -6
          git push origin HEAD:android16-aptusitu
